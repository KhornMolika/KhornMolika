name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6C0B25&color_dots=#FAF7E7,#B5AD80,#64652A,#461312,#2E1A0E
            dist/github-contribution-grid-snake.gif?color_snake=#6C0B25&color_dots=#FAF7E7,#B5AD80,#64652A,#461312,#2E1A0E
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
